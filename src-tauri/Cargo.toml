[package]
name = "filmie"
version = "0.7.0-beta.2"
edition = "2024"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
keyring-core = "1.0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1.54.1", features = ["sync", "time"] }
windows-native-keyring-store = "1.1.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = "0.6"
jni = "0.22"
log = "0.4"
obfstr = "0.4"

# Smallest and fastest installer; only release builds pay the extra compile time.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
