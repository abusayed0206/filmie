name: Release

# Push a tag such as v0.1.0 to publish. Running it by hand builds the installer without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"
            exit 1
          fi

      # Only published builds need real keys. A manual run just proves the installer builds.
      - name: Check the release keys are set
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TMDB: ${{ secrets.TMDB }}
          TRAKT: ${{ secrets.TRAKT }}
        run: |
          if [ -z "$TMDB" ] || [ -z "$TRAKT" ]; then
            echo "::error::Add the TMDB and TRAKT repository secrets. A build without them has no working data."
            exit 1
          fi

      - uses: ./.github/actions/setup
        with:
          cache-key: release
          tmdb: ${{ secrets.TMDB }}
          trakt: ${{ secrets.TRAKT }}
          trakt-redirect-uri: ${{ secrets.TRAKT_REDIRECT_URI }}

      # rust-cache keeps ~/.cargo/bin, so this only compiles when the cache is cold.
      - run: cargo install tauri-cli --version "^2" --locked

      - run: cargo tauri build --bundles nsis --ci
        working-directory: src-tauri

      # A fixed name lets the website link to releases/latest/download/ across versions.
      - name: Collect the installer
        shell: bash
        run: |
          mkdir dist
          cp src-tauri/target/release/bundle/nsis/*-setup.exe dist/Filmy-Setup-x64.exe
          (cd dist && sha256sum Filmy-Setup-x64.exe > Filmy-Setup-x64.exe.sha256)
          cat dist/Filmy-Setup-x64.exe.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: filmy-windows
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # Separate job: only this one can write to the repository, and it never runs the build or sees the keys.
  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: filmy-windows
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes "${prerelease[@]}"
