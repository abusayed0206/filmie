name: Android Build

on:
  push:
    branches: [main, android]
    paths:
      - "src-tauri/**"
      - ".github/workflows/android.yml"
      - ".github/actions/setup/**"
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/android.yml"
      - ".github/actions/setup/**"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  # Cache keys
  RUST_CACHE_KEY: android-rust-${{ hashFiles('src-tauri/Cargo.lock') }}
  GRADLE_CACHE_KEY: android-gradle-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/**/gradle-wrapper.properties') }}
  ANDROID_SDK_CACHE_KEY: android-sdk-${{ runner.os }}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ env.RUST_CACHE_KEY }}
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ env.GRADLE_CACHE_KEY }}
          restore-keys: |
            android-gradle-

      - name: Cache Android SDK
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android
          key: ${{ env.ANDROID_SDK_CACHE_KEY }}

      - name: Setup Android SDK
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;27.1.12297006
            cmake;3.22.1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: ./.github/actions/setup
        with:
          cache-key: android
          components: clippy

      - name: Add Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install tauri-cli
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -alias filmie \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Filmie Debug, O=Filmie, C=US" \
            -keypass android \
            -keystore src-tauri/filmie.keystore \
            -storepass android

      - name: Initialize Android project
        run: cargo tauri android init --ci
        working-directory: src-tauri
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          NDK_HOME: /usr/local/lib/android/sdk/ndk/27.1.12297006

      - name: Build APK
        run: cargo tauri android build --ci
        working-directory: src-tauri
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          NDK_HOME: /usr/local/lib/android/sdk/ndk/27.1.12297006

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/gen/android -name "*.apk" -type f | head -1 | xargs -I {} cp {} dist/Filmie.apk
          (cd dist && sha256sum Filmie.apk > Filmie.apk.sha256)
          cat dist/Filmie.apk.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: filmie-android
          path: dist/
          if-no-files-found: error
          retention-days: 14