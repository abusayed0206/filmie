[package]
name = "filmie"
version = "0.2.0"
edition = "2024"

[dependencies]
keyring-core = "1.0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1.54.1", features = ["sync", "time"] }
windows-native-keyring-store = "1.1.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Smallest and fastest installer; only release builds pay the extra compile time.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
