name: Security audit

# New advisories appear without any code change, so this also runs weekly.
on:
  push:
    branches: [main]
    paths: ["src-tauri/Cargo.lock", "src-tauri/Cargo.toml", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["src-tauri/Cargo.lock", "src-tauri/Cargo.toml", ".github/workflows/audit.yml"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
        working-directory: src-tauri
