<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filmie</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 5v14l11-7z" fill="currentColor" stroke="none"/><path d="M19 5v14"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5h18l-7 8.5V20l-4-2v-4.5z"/></symbol>
    <symbol id="i-media" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-shrink" viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="i-sync" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12a9 9 0 0 1 15.5-6.2M21 4v5h-5M3 20v-5h5"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l-5-5 5-5M5 12h11"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 9.5V20h5v-6h4v6h5V9.5"/></symbol>
    <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 3l4 4 4-4"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16M3 9h5M3 15h5M16 9h5M16 15h5"/></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5M3.5 4v4.5H8M12 7.5V12l3 2"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M5 4v16M10 4v16M15 4.5l4.5 15"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  </svg>
  <nav class="rail" aria-label="Main">
    <div class="rail-head">
      <button id="rail-toggle" class="rail-item" aria-expanded="false" aria-label="Expand navigation"><svg class="i" aria-hidden="true"><use href="#i-menu"/></svg></button>
      <a href="#/" class="logo" aria-label="Filmie"><span class="logo-short">F</span><span class="logo-full">Filmie</span></a>
    </div>
    <div class="rail-nav">
      <a href="#/search" class="rail-item" data-nav="search" aria-keyshortcuts="Control+K"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><span class="nav-label">Search</span><kbd class="rail-hint" aria-hidden="true">Ctrl K</kbd></a>
      <a href="#/" class="rail-item" data-nav=""><svg class="i" aria-hidden="true"><use href="#i-home"/></svg><span class="nav-label">Home</span></a>
      <a href="#/progress" class="rail-item nav-sub" data-nav="progress" data-auth><span class="nav-label">Continue Watching</span></a>
      <a href="#/calendar" class="rail-item nav-sub" data-nav="calendar" data-auth><span class="nav-label">Calendar</span></a>
      <a href="#/discover/recommended" class="rail-item nav-sub" data-nav="discover/recommended" data-auth><span class="nav-label">Recommended</span></a>
      <a href="#/discover" class="rail-item" data-nav="discover"><svg class="i" aria-hidden="true"><use href="#i-compass"/></svg><span class="nav-label">Discover</span></a>
      <a href="#/discover/trending" class="rail-item nav-sub" data-nav="discover/trending"><span class="nav-label">Trending</span></a>
      <a href="#/discover/releases" class="rail-item nav-sub" data-nav="discover/releases"><span class="nav-label">Releases</span></a>
      <a href="#/discover/anticipated" class="rail-item nav-sub" data-nav="discover/anticipated"><span class="nav-label">Anticipated</span></a>
      <a href="#/discover/popular" class="rail-item nav-sub" data-nav="discover/popular"><span class="nav-label">Popular</span></a>
      <a href="#/lists" class="rail-item" data-nav="lists" data-auth><svg class="i" aria-hidden="true"><use href="#i-list"/></svg><span class="nav-label">Lists</span></a>
      <a href="#/watchlist" class="rail-item nav-sub" data-nav="watchlist" data-auth><span class="nav-label">Watchlist</span></a>
      <a href="#/lists/personal" class="rail-item nav-sub" data-nav="lists/personal" data-auth><span class="nav-label">My Lists</span></a>
      <a href="#/lists/liked" class="rail-item nav-sub" data-nav="lists/liked" data-auth><span class="nav-label">Liked</span></a>
      <a href="#/lists/shared" class="rail-item nav-sub" data-nav="lists/shared" data-auth><span class="nav-label">Shared</span></a>
    </div>
    <div class="rail-bottom" id="rail-bottom">
      <a href="#/settings" id="account" class="rail-item" data-nav="profile"><svg class="i" aria-hidden="true"><use href="#i-user"/></svg><span class="nav-label">Sign in</span></a>
      <div class="rail-menu">
        <a href="#/history" class="rail-item" data-nav="history" data-auth><svg class="i" aria-hidden="true"><use href="#i-history"/></svg><span class="nav-label">History</span></a>
        <a href="#/library" class="rail-item" data-nav="library" data-auth><svg class="i" aria-hidden="true"><use href="#i-library"/></svg><span class="nav-label">Library</span></a>
        <a href="#/settings" class="rail-item" data-nav="settings"><svg class="i" aria-hidden="true"><use href="#i-settings"/></svg><span class="nav-label">Settings</span></a>
        <button class="rail-item fs-btn" aria-label="Toggle fullscreen"><svg class="i fs-on" aria-hidden="true"><use href="#i-expand"/></svg><svg class="i fs-off" aria-hidden="true"><use href="#i-shrink"/></svg><span class="nav-label">Fullscreen</span></button>
      </div>
    </div>
  </nav>
  <header class="topbar" id="topbar"><div class="topbar-left"></div><div class="topbar-center"></div><div class="topbar-right"><button type="button" id="filter-btn" class="icon-btn ghost filter-btn" aria-label="Filters" disabled><svg class="i" aria-hidden="true"><use href="#i-filter"/></svg><span class="badge" aria-hidden="true"></span></button></div></header>
  <div class="searchbar"><label class="search"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
    <input id="q" type="search" placeholder="Search movies & shows" aria-label="Search movies and shows" autocomplete="off"></label></div>
  <main id="app" tabindex="-1"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="lib.js"></script>
  <script src="core.js"></script>
  <script src="controls.js"></script>
  <script src="cards.js"></script>
  <script src="pages-browse.js"></script>
  <script src="pages-title.js"></script>
  <script src="pages-me.js"></script>
  <script src="app.js"></script>
</body>
</html>
