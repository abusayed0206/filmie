name: Android Build

# Test-only pipeline: builds a debug-signed APK and keeps it as an artifact. It never publishes a release.
on:
  push:
    branches: [android]
    paths:
      - "src-tauri/**"
      - "ui/**"
      - "scripts/fetch-ubol.ps1"
      - ".github/workflows/android.yml"
      - ".github/actions/setup/**"
  pull_request:
    branches: [android]
    paths:
      - "src-tauri/**"
      - "ui/**"
      - "scripts/fetch-ubol.ps1"
      - ".github/workflows/android.yml"
      - ".github/actions/setup/**"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # A test APK needs no Rust debug symbols, and leaving them out keeps it much smaller.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: short

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships the SDK and platform 37 but no NDK, so install the same one Tauri's own CI uses.
      - name: Install the Android NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk=$(ls -d "$ANDROID_HOME"/ndk/29.* 2>/dev/null | tail -1 || true)
          if [ -z "$ndk" ]; then
            sdkmanager=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
            "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "ndk;29.0.14206865"
            ndk="$ANDROID_HOME/ndk/29.0.14206865"
          fi
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" || {
            echo "::error::NDK r29 not found at $ndk"
            exit 1
          }
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-v1
          restore-keys: |
            gradle-android-

      # Without this every run makes a new debug key, and the APK can't install over the last one.
      - name: Cache the debug signing key
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - uses: ./.github/actions/setup
        with:
          cache-key: android
          # Real keys: with the placeholders nothing loads and Trakt rejects the client ID.
          tmdb: ${{ secrets.TMDB }}
          trakt: ${{ secrets.TRAKT }}
          trakt-redirect-uri: ${{ secrets.TRAKT_REDIRECT_URI }}

      - name: Add the Android Rust target
        run: rustup target add aarch64-linux-android

      - name: Install the Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Initialize the Android project
        working-directory: src-tauri
        run: cargo tauri android init --ci --skip-targets-install

      # tauri android init copies the template's icons, so put Filmie's over them.
      - name: Apply the Filmie launcher icons
        run: cp -R src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/

      # The template's DayNight theme drew a white window and white status bar icons on a light-mode phone.
      - name: Apply the dark window theme
        run: cp -R scripts/android/res/. src-tauri/gen/android/app/src/main/res/

      - name: Build the debug APK
        working-directory: src-tauri
        run: cargo tauri android build --debug --apk --ci --target aarch64

      - name: Collect the APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$apk" || { echo "::error::No APK was produced"; exit 1; }
          cp "$apk" dist/Filmie-android-debug.apk
          (cd dist && sha256sum Filmie-android-debug.apk > Filmie-android-debug.apk.sha256)
          cat dist/Filmie-android-debug.apk.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: filmie-android-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14
